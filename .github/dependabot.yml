version: 2
updates:
- package-ecosystem: nuget
  directory: /Sources
  # The cmdlet coverage host targets .NET 8 and uses PowerShell 7.4.
  ignore:
  - dependency-name: Microsoft.PowerShell.SDK
    versions: ['>=7.5']
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
