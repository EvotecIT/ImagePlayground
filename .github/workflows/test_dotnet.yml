name: Test .NET

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: 'Release'

jobs:
  test-windows:
    name: 'Windows'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Restore dependencies
        run: dotnet restore Sources/ImagePlayground.sln

      - name: Build solution
        run: dotnet build Sources/ImagePlayground.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test Sources/ImagePlayground.Tests/ImagePlayground.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

      - name: Run Tree-sitter tests
        run: dotnet test Sources/ImagePlayground.Syntax.TreeSitter.Tests/ImagePlayground.Syntax.TreeSitter.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-windows
          path: '**/coverage.cobertura.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'

  test-ubuntu:
